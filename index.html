<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operação: O Sonho Acabou | Contagem Regressiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #080808;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
        }

        .subtitle {
            color: #00f3ff;
            text-shadow: 0 0 5px #00f3ff;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .profile-area {
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .profile-pic {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff007f;
            box-shadow: 0 0 15px #ff007f;
            background-color: #222;
        }

        .profile-placeholder {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #ff007f;
            box-shadow: 0 0 15px #ff007f;
            background: #111;
            color: #666;
            font-size: 0.9rem;
        }

        /* Medidor de Desespero */
        .despair-container {
            max-width: 500px;
            margin: 0 auto 40px auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .despair-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #ffaa00;
            text-shadow: 0 0 5px #ffaa00;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .despair-bar-bg {
            width: 100%;
            height: 20px;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ffaa00;
            box-shadow: 0 0 5px rgba(255, 170, 0, 0.2);
        }

        .despair-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffaa00, #ff0055);
            box-shadow: 0 0 15px #ff0055;
            transition: width 0.4s ease;
        }

        /* Contador */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .countdown-box {
            background: rgba(0, 243, 255, 0.02);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1), inset 0 0 10px rgba(0, 243, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            min-width: 140px;
            backdrop-filter: blur(5px);
        }

        .number {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #00f3ff;
            line-height: 1;
            margin-bottom: 5px;
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00f3ff;
        }

        .sub-label {
            font-size: 0.65rem;
            color: #ff007f;
            text-shadow: 0 0 2px #ff007f;
            display: block;
            margin-top: 2px;
            font-style: italic;
        }

        /* Quadro de Avisos / Pop-ups Dinâmicos */
        .popup-box {
            background: rgba(255, 0, 85, 0.05);
            border: 1px dashed #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.1);
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .popup-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #ff0055;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .popup-text {
            font-size: 1.1rem;
            color: #e0e0e0;
            line-height: 1.4;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            .countdown-box { min-width: 110px; padding: 10px; }
            .number { font-size: 2rem; }
            .profile-pic, .profile-placeholder { width: 130px; height: 130px; }
        }
    </style>
</head>
<body>

        <h1>Operação: O Sonho Acabou</h1>
        <div class="subtitle">Contagem regressiva para o fim da mamicidade</div>
        
        <div class="profile-area">
            <img src="foto.jpg" alt="Foto do Sobrevivente" class="profile-pic" onerror="this.style.display='none'; document.getElementById('placeholder').style.display='flex'">
            <div id="placeholder" class="profile-placeholder" style="display: none;">
                <span>Foto do Alvo<br>(foto.jpg)</span>
            </div>
        </div>

        <!-- Medidor de Desespero -->
        <div class="despair-container">

                <span>Nível de Desespero Pré-Retorno</span>
                <span id="despair-percentage">0%</span>
            </div>
            <div class="despair-bar-bg">
                <div class="despair-bar-fill" id="despair-fill"></div>
            </div>
        </div>

        <!-- Contador Modificado -->
        <div class="countdown-container">

            <div class="countdown-box">

                <div class="label">Minutos</div>
                <div class="sub-label">para chorar no banho</div>
            </div>
            <div class="countdown-box">
                <div class="number" id="seconds">00</div>
                <div class="label">Segundos</div>
                <div class="sub-label">de liberdade</div>
            </div>
        </div>

        <!-- Quadro de Avisos -->
        <div class="popup-box">

            <div class="popup-text" id="dynamic-message">
                Conectando à rede da firma...
            </div>
        </div>
    </div>
