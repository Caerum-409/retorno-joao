<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operação: O Sonho Acabou | Contagem Regressiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #030303;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Camada 1: Alerta Vermelho de Emergência com Brilho Intenso nas Bordas */
        .prison-alarm-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, transparent 30%, rgba(255, 0, 85, 0.45) 100%);
            z-index: 1;
            pointer-events: none;
            animation: alarmPulse 2.5s infinite alternate ease-in-out;
        }

        /* Camada 2: Grades de Prisão Neon Ciano */
        .prison-bars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.22) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.22) 2px, transparent 2px);
            background-size: 50px 50px;
            background-position: center;
            z-index: 2;
            pointer-events: none;
            animation: neonGlow 4s infinite alternate ease-in-out;
        }

        /* Camada 3: Contêiner para os Gatinhos Aleatórios do Fundo */
        .meme-wallpaper-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .random-meme {
            position: absolute;
            opacity: 0.25; /* Opacidade sutil para ficar de fundo */
            filter: contrast(110%);
            object-fit: contain;
        }

        @keyframes alarmPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; filter: drop-shadow(0 0 15px rgba(255, 0, 85, 0.4)); }
        }

        @keyframes neonGlow {
            0% { filter: drop-shadow(0 0 2px rgba(0, 243, 255, 0.4)); opacity: 0.8; }
            100% { filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.9)); opacity: 1; }
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
        }

        .subtitle {
            color: #00f3ff;
            text-shadow: 0 0 5px #00f3ff;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .profile-area {
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .profile-pic {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff007f;
            box-shadow: 0 0 15px #ff007f;
            background-color: #222;
        }

        .profile-placeholder {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #ff007f;
            box-shadow: 0 0 15px #ff007f;
            background: #111;
            color: #666;
            font-size: 0.9rem;
        }

        /* Medidor de Desespero */
        .despair-container {
            max-width: 500px;
            margin: 0 auto 40px auto;
            background: rgba(0, 0, 0, 0.95);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .despair-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #ffaa00;
            text-shadow: 0 0 5px #ffaa00;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .despair-bar-bg {
            width: 100%;
            height: 20px;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ffaa00;
            box-shadow: 0 0 5px rgba(255, 170, 0, 0.2);
        }

        .despair-bar-fill {
            height: 100%;
            width: 73%;
            background: linear-gradient(90deg, #ffaa00, #ff0055);
            box-shadow: 0 0 15px #ff0055;
        }

        /* Bloco Central de Dias Expandido */
        .countdown-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .countdown-box {
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.15);
            border-radius: 20px;
            padding: 40px 60px;
            max-width: 450px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .number {
            font-size: 7rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px #00f3ff, 0 0 40px rgba(0, 243, 255, 0.6);
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .label {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #00f3ff;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .sub-label {
            font-size: 1rem;
            color: #ff007f;
            text-shadow: 0 0 4px #ff007f;
            display: block;
            font-style: italic;
            font-weight: 500;
        }

        /* Quadro de Avisos */
        .popup-box {
            background: rgba(0, 0, 0, 0.95);
            border: 1px dashed #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.25);
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            backdrop-filter: blur(10px);
        }

        .popup-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #ff0055;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .popup-text {
            font-size: 1.1rem;
            color: #e0e0e0;
            line-height: 1.4;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            .countdown-box { padding: 25px 35px; max-width: 300px; }
            .number { font-size: 4.5rem; }
            .label { font-size: 1.1rem; }
            .sub-label { font-size: 0.85rem; }
            .profile-pic, .profile-placeholder { width: 130px; height: 130px; }
        }
    </style>
</head>
<body>

    <div class="prison-alarm-bg"></div>
    <div class="prison-bars-bg"></div>
    
    <!-- Contêiner do papel de parede de memes -->
    <div class="meme-wallpaper-container" id="wallpaper-box"></div>

    <div class="container">
        <h1>Operação: O Sonho Acabou</h1>
        <div class="subtitle">Contagem regressiva para o fim da vagabundagem</div>
        
        <div class="profile-area">
            <img src="foto.jpg" alt="Foto do Sobrevivente" class="profile-pic" onerror="this.style.display='none'; document.getElementById('placeholder').style.display='flex'">
            <div id="placeholder" class="profile-placeholder" style="display: none;">
                <span>Foto do Alvo<br>(foto.jpg)</span>
            </div>
        </div>

        <!-- Medidor de Desespero -->
        <div class="despair-container">
            <div class="despair-label">
                <span>Nível de Desespero </span>
                <span id="despair-percentage">73%</span>
            </div>
            <div class="despair-bar-bg">
                <div class="despair-bar-fill" id="despair-fill"></div>
            </div>
        </div>

        <!-- Painel de Contagem -->
        <div class="countdown-container">
            <div class="countdown-box">
                <div class="number" id="days">04</div>
                <div class="label">Dias Restantes</div>
                <div class="sub-label">de puro desespero</div>
            </div>
        </div>

        <!-- Quadro de Avisos -->
        <div class="popup-box">
            <div class="popup-title">⚠️ Alerta do Sistema Suporte ⚠️</div>
            <div class="popup-text" id="dynamic-message">
                Maquina do amigo sendo desmontada 3...2...1.
            </div>
        </div>
    </div>
